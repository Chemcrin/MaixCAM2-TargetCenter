id: maixcam2_rect_center
name: MaixCAM2 Rectangle Center
name[zh]: MaixCAM2 矩形黑框中心
version: 1.12.3
icon: assets/icon.png
author: 25Efork
desc: Detect a black rectangle and output its perspective-correct center; a laser-spot panel shows the spot-to-center pixel offset; optional two-axis ZDT gimbal aiming closed loop; reusable target_api for other tasks.
desc[zh]: 识别白底黑框中心，屏幕左上角显示激光光斑到靶心的像素偏差（光斑位置默认写死），可选双轴 ZDT 云台自动瞄准；对外提供 target_api 供各小问直接调用。
# 默认"包含目录内全部文件"，下列为排除项（.git / __pycache__ 由打包器强制排除，无需声明）。
# ⚠ 应用包必须只有：app.yaml + .py 源码 + assets/icon.png。新增文档/图/调试产物后，
#    务必跑 tools/check_app.py --manifest 核一遍包内清单。
# ⚠ 列表项不能写行内注释：解析器会把 "#..." 当成文件名的一部分。
exclude:
  # 开发工具脚本：不进包
  - tools
  # 单文件版产物（tools/build_single.py 生成，供 MaixVision「运行当前文件」）
  - dist
  - build
  - .vscode
  - .workbuddy
  - .gitignore
  - .gitattributes
  - __pycache__
  # 文档（应用目录内唯一文档 + 通配兜底：打包器不支持通配时靠上一行生效）
  - README.md
  - "*.md"
  # 调试落盘图不进包（assets/icon.png 是图标，必须保留，故不能排 *.png）
  - screenshot*.png
  - frame*.png
  - mask*.png
  - debug_*.png
